<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải thuật Quy hoạch tuyến tính</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>BÀI TẬP CODE QUY HOẠCH TUYẾN TÍNH</h1>
            <p>NHÓM SINH VIÊN :</p>
        </header>

        <main>
            <section class="config-panel card">
                <h2>1. Cấu hình bài toán</h2>
                <div class="form-row">
                    <div class="input-group">
                        <label for="num_vars">Số biến (n):</label>
                        <input type="number" id="num_vars" min="1" max="10" value="2">
                    </div>
                    <div class="input-group">
                        <label for="num_constraints">Số ràng buộc (m):</label>
                        <input type="number" id="num_constraints" min="1" max="15" value="3">
                    </div>
                    <div class="input-group">
                        <label for="problem_type">Loại bài toán:</label>
                        <select id="problem_type">
                            <option value="-1">Min (Cực tiểu)</option>
                            <option value="1">Max (Cực đại)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>&nbsp;</label>
                        <button id="btn-generate" class="btn-primary">Tạo bảng nhập liệu</button>
                    </div>
                </div>
            </section>

            <section id="input-section" class="input-panel card" style="display: none;">
                <h2>2. Nhập dữ liệu hệ số</h2>

                <div class="objective-function">
                    <h3>Hàm mục tiêu Z:</h3>
                    <div id="c-inputs" class="coefficient-row"></div>
                </div>

                <div class="constraints-section">
                    <h3>Hệ ràng buộc:</h3>
                    <div id="mt-inputs" class="constraints-grid"></div>
                </div>

                <div class="variables-section">
                    <h3>Điều kiện biến:</h3>
                    <div id="ivec-inputs" class="coefficient-row"></div>
                </div>

                <div class="method-section form-row">
                    <div class="input-group">
                        <label for="method">Phương pháp giải:</label>
                        <select id="method">
                            <option value="donhinh">Đơn hình</option>
                            <option value="bland">Quy tắc Bland</option>
                            <option value="2pha">Đơn hình 2 Pha</option>
                            <option value="dual">Đơn hình Đối ngẫu</option>
                            <option value="2pha_dual">2 Pha Đối ngẫu gốc</option>
                            <option value="hinh_hoc">Hình học (Chỉ 2 biến)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>&nbsp;</label>
                        <button id="btn-solve" class="btn-success">Giải bài toán</button>
                    </div>
                </div>
            </section>

            <section id="result-section" class="result-panel card" style="display: none;">
                <h2>3. Kết quả</h2>
                <div class="result-summary" id="result-summary"></div>

                <div id="chart-container" class="chart-wrapper" style="display: none;">
                    <div id="lpChart"></div>
                    <div id="z-slider-container" style="display: none; margin-top: 1rem;">
                        <label for="z-slider">Kéo để trượt hàm mục tiêu (Z = <span id="z-value">0</span>):</label>
                        <input type="range" id="z-slider" min="0" max="100" step="0.1" value="0" style="width: 100%;">
                    </div>
                </div>

                <div class="step-by-step">
                    <h3>Chi tiết quá trình:</h3>
                    <div id="dictionary-log" class="dictionary-container" style="display: none;"></div>
                    <pre id="output-log"></pre>
                </div>
            </section>
        </main>
    </div>

    <!-- Spinner -->
    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=4"></script>
</body>

</html>
